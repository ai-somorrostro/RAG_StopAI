<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente RAG de normativa de IA</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0e1117;
      color: #fafafa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }
    #status a { color: #4da3ff; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 4px solid #333;
      border-top-color: #4da3ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="status">
    <div class="spinner"></div>
    <div>Conectando con el asistente…</div>
    <div id="detail"></div>
  </div>
  <iframe id="app" title="Asistente RAG de normativa de IA" allow="clipboard-read; clipboard-write" hidden></iframe>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");
      const frame = document.getElementById("app");
      try {
        const response = await fetch("tunnel.txt?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("No se pudo leer la URL del túnel.");
        const url = (await response.text()).trim();
        if (!/^https:\/\/[^\s]+$/.test(url)) throw new Error("La URL del túnel no es válida.");
        frame.addEventListener("load", () => {
          status.hidden = true;
          frame.hidden = false;
        });
        frame.src = url;
        detail.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener">Abrir en una pestaña nueva</a>';
        setTimeout(() => {
          if (!frame.hidden) return;
          detail.innerHTML = 'La app tarda en cargar. <a href="' + url + '" target="_blank" rel="noopener">Ábrela en una pestaña nueva</a>.';
        }, 20000);
      } catch (error) {
        status.innerHTML = '<div>El asistente no está disponible ahora mismo.</div><div>' + error.message + "</div>";
      }
    })();
  </script>
</body>
</html>
